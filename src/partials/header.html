<html lang="{{#lang pt}}pt-PT{{/lang}}{{#lang en}}en{{/lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{titulo}}</title>
  <meta name="description" content="{{descricao}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gringo's Washboard Band">
  <meta property="og:title" content="{{titulo}}">
  <meta property="og:description" content="{{descricao}}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="{{classe?}}">

  <!-- ===== Header ===== -->
  <header class="site-header">
    <a class="logo" href="index.html" aria-label="Gringo's Washboard Band — {{#lang pt}}início{{/lang}}{{#lang en}}home{{/lang}}">
      <img src="images/logo.jpg" alt="" width="100" height="100">
    </a>
    <div class="header-right">
      <!-- @social -->
      <button class="burger" type="button" aria-label="{{#lang pt}}Abrir menu{{/lang}}{{#lang en}}Open menu{{/lang}}" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ===== Fullscreen menu ===== -->
  <div class="menu" id="menu" aria-hidden="true">
    <button class="menu-close" type="button" aria-label="{{#lang pt}}Fechar menu{{/lang}}{{#lang en}}Close menu{{/lang}}">&times;</button>
    <nav aria-label="{{#lang pt}}Principal{{/lang}}{{#lang en}}Main{{/lang}}">
      <ul>
        <li><a href="index.html">{{#lang pt}}Início{{/lang}}{{#lang en}}Home{{/lang}}</a></li>
        <li><a href="index.html#band">{{#lang pt}}Sobre{{/lang}}{{#lang en}}About{{/lang}}</a></li>
        <li><a href="index.html#videos">{{#lang pt}}Média{{/lang}}{{#lang en}}Media{{/lang}}</a></li>
        <li><a href="index.html#tour">{{#lang pt}}Agenda{{/lang}}{{#lang en}}Tour{{/lang}}</a></li>
        <li><!-- @idioma --></li>
        <li><a href="#contact">{{#lang pt}}Contacto{{/lang}}{{#lang en}}Contact{{/lang}}</a></li>
      </ul>
      <!-- @social -->
    </nav>
  </div>
