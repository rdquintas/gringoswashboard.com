# Configurações do site (lidas pelo build.js; este ficheiro não é copiado para dist/)

# Secção hero (slideshow no topo da página)
section_hero:
  # Imagens do slideshow (ficheiros em src/images/), pela ordem em que aparecem. Cada uma tem
  # uma versão horizontal (desktop, 1920×900) e uma vertical (telemóvel na vertical, 1080×1920).
  hero:
    - horizontal: hero01.png
      vertical: hero01_v.png
    - horizontal: hero02.png
      vertical: hero02_v.png
    - horizontal: hero03.png
      vertical: hero03_v.png
  
  cta1:
    pt: "Contratar a Banda"
    en: "Book the Band"
    link: "#book"

  cta2:
    pt: "Masterclass"
    en: "Masterclass"
    link: "#masterclass"

  # Tempo (em segundos) que cada imagem fica visível antes de passar à seguinte
  duracao_hero: 3

# Secção ABOUT 
section_about:
  # Membros da banda: nome, instrumento (pt e en) e foto (ficheiro em src/images/)
  members:
    - nome: Zé "Gringo" Tábuas
      instrumento:
        pt: Tábua de lavar e voz
        en: Washboard & vocals
      foto: musico01.png

    - nome: Rita Banjo
      instrumento:
        pt: Banjo e voz
        en: Banjo & vocals
      foto: musico02.png

    - nome: Tiago Cordas
      instrumento:
        pt: Guitarra
        en: Guitar
      foto: musico03.png

    - nome: Nuno Tina
      instrumento:
        pt: Contrabaixo de tina
        en: Washtub bass
      foto: musico04.png

    - nome: Inês Sopro
      instrumento:
        pt: Kazoo e harmónica
        en: Kazoo & harmonica
      foto: musico05.png



# Secção AGENDA 
section_agenda:
  # Imagens usadas nos concertos sem `imagem_h` (hero) ou sem `imagem_v_4x5` (hero_v; também na partilha)
  default_images:
    hero: 'pic01.jpg'
    hero_v: 'default_4x5.png'

