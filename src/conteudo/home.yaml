# Configurações do site (lidas pelo build.js; este ficheiro não é copiado para dist/)

# Secção hero (slideshow no topo da página)
section_hero:
  # Imagens do slideshow (ficheiros em src/images/), pela ordem em que aparecem
  hero:
    - hero01.png
    - hero02.png
    - hero03.png

  # Tempo (em segundos) que cada imagem fica visível antes de passar à seguinte
  duracao_hero: 3

# Secção ABOUT 
section_about:
  # Membros da banda: nome, instrumento (pt e en) e foto (ficheiro em src/images/)
  members:
    - nome: Zé "Gringo" Tábuas
      instrumento:
        pt: Tábua de lavar e voz
        en: Washboard & vocals
      foto: musico01.png

    - nome: Rita Banjo
      instrumento:
        pt: Banjo e voz
        en: Banjo & vocals
      foto: musico02.png

    - nome: Tiago Cordas
      instrumento:
        pt: Guitarra
        en: Guitar
      foto: musico03.png

    - nome: Nuno Tina
      instrumento:
        pt: Contrabaixo de tina
        en: Washtub bass
      foto: musico04.png

    - nome: Inês Sopro
      instrumento:
        pt: Kazoo e harmónica
        en: Kazoo & harmonica
      foto: musico05.png
