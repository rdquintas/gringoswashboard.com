# Secção "sobre" (a banda) do index, uma versão por língua, em Markdown (tudo no README):
#   ## Título (h2; ### h3)         > citação em destaque (pullquote)
#   **negrito**, *itálico*         [texto](https://…)    ![descrição](band.jpg) (em images/)
#   ::: split … :::  texto e imagem lado a lado (imagem primeiro → imagem à esquerda)
#   {.classe} no fim de um bloco junta-lhe classes do CSS
# Parágrafos separados por uma linha em branco.
section_about:
  texto_pt: |-
    ## Sobre a Gringo's Washboard Band

    Há mais de uma década a tocar na América do Sul e na Europa, a Gringo's Washboard Band está de volta com o espetáculo *Root of the Oppressed*, numa época que precisa de música mais do que nunca.

    > “Root of the Oppressed é uma aula de história transformada em música.”

    
    Liderada pelo percussionista brasileiro Guto Krainski, a Gringo's Washboard Band tem vindo a contar a história da música negra americana.

    A Gringo's Washboard Band já passou por diversos festivais de blues e jazz na Europa e na América do Sul, incluindo o Santa Maria Blues Festival, o Mississippi Delta Blues Festival, o Jazz Mansion e o Ilha Comprida Festival Internacional, entre muitos outros. Destacou-se também em programas televisivos como o SuperStar da Rede Globo e o Got Talent Portugal (onde foi semifinalista em 2026), e foi vencedora do Portugal Blues Challenge.

    O espetáculo *Root of the Oppressed* propõe uma imersão nas narrativas negligenciadas da música negra americana. Longe dos clichês comerciais, o concerto traz à tona a crueza da segregação racial, da misoginia e do trabalho análogo à escravidão — realidades históricas que ainda ecoam na sociedade contemporânea.
    
    ### A Gringo's Washboard Band

    Fundada em 2013 por Guto Krainski (percussionista e contador de histórias), a Gringo's Washboard Band reúne músicos de jazz tradicional. A sua música bebe do blues, da revolução de Ida Cox e do espírito de Nova Orleans — tudo revitalizado para um público contemporâneo que, ao que parece, estava à espera exatamente disso.

    ![Fotografia de grupo da Gringo's Washboard Band](band.jpg)

  texto_en: |-
    ## About Gringo's Washboard Band

    After more than a decade playing across South America and Europe, Gringo's Washboard Band is back with the show *Root of the Oppressed*, at a time that needs music more than ever.

    > “Root of the Oppressed is a history lesson turned into music.”

    Led by Brazilian percussionist Guto Krainski, Gringo's Washboard Band has been telling the story of African American music.

    Gringo's Washboard Band has played many blues and jazz festivals in Europe and South America, including Santa Maria Blues Festival, Mississippi Delta Blues Festival, Jazz Mansion and Ilha Comprida Festival Internacional, among many others. The band has also stood out on TV shows such as Rede Globo's SuperStar and Got Talent Portugal (where it reached the semi-finals in 2026), and won the Portugal Blues Challenge.

    The show *Root of the Oppressed* offers an immersion in the neglected narratives of African American music. Far from commercial clichés, the concert brings to light the harshness of racial segregation, misogyny and slavery-like labour — historical realities that still echo in today's society.    

    ### Gringo's Washboard Band

    Founded in 2013 by Guto Krainski (percussionist and storyteller), Gringo's Washboard Band brings together traditional jazz musicians. Its music draws on the blues, the revolution of Ida Cox and the spirit of New Orleans — all revitalised for a contemporary audience that, it seems, was waiting for exactly that.

    ![Group photo of Gringo's Washboard Band](band.jpg)


