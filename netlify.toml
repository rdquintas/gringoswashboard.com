# Netlify: faz `npm run build` e publica a pasta dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"   # igual ao .nvmrc

# Cabeçalhos de segurança. A CSP não permite scripts nem estilos inline.
# Domínios externos: Google Fonts (CSS em fonts.googleapis.com, ficheiros em fonts.gstatic.com),
# Font Awesome via cdnjs.cloudflare.com (CSS + fontes) e imagens placeholder de placehold.co.
# Novos domínios externos (imagens, scripts, iframes, fontes) têm de ser acrescentados aqui.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://placehold.co https://i.ytimg.com; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# HTML: o Netlify já serve por defeito "public, max-age=0, must-revalidate"
# (o browser revalida sempre), por isso não é preciso definir aqui.
